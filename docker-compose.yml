services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logria
      POSTGRES_USER: logria
      POSTGRES_PASSWORD: logria
    ports:
      - "5432:5432"
    volumes:
      - logria-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logria -d logria"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  logria-postgres:
